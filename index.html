<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>FLS Command Center — Corinthia Tripoli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#17140f; --ink-soft:#3a352c; --paper:#faf8f3; --panel:#ffffff;
    --line:#e6e1d4; --line-soft:#f0ece1; --brass:#a9803f; --brass-dark:#7d5f2e; --brass-tint:#f4ead4;
    --muted:#7b7568; --success:#3f6f52; --success-tint:#e9f1ea; --danger:#a2402e; --danger-tint:#f8e9e6;
    --radius:14px; --radius-sm:9px;
    --shadow-card:0 1px 2px rgba(23,20,15,.04), 0 8px 24px -12px rgba(23,20,15,.14);
    --shadow-pop:0 20px 60px -20px rgba(23,20,15,.35);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:radial-gradient(1200px 600px at 50% -10%, #fff 0%, var(--paper) 55%) fixed;color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;}
  html[dir="rtl"] body{font-family:'Cairo','Inter',system-ui,sans-serif;}
  h1,h2,h3,.serif{font-family:'Playfair Display',Georgia,serif;}
  html[dir="rtl"] h1, html[dir="rtl"] h2, html[dir="rtl"] h3, html[dir="rtl"] .serif{font-family:'Cairo','Playfair Display',serif;}
  button{font-family:inherit;} input,textarea{font-family:inherit;} ::selection{background:var(--brass-tint);}

  #app{min-height:100vh;display:flex;flex-direction:column;}
  .topbar{position:sticky;top:0;z-index:20;background:rgba(250,248,243,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .topbar .brand{display:flex;align-items:center;gap:10px;min-width:0;}
  .topbar .mark{width:26px;height:26px;flex-shrink:0;} .topbar .mark svg{width:100%;height:100%;display:block;}
  .topbar .brand-text{line-height:1.15;min-width:0;}
  .topbar .brand-text .t1{font-size:13px;letter-spacing:.04em;font-weight:600;}
  .topbar .brand-text .t2{font-size:10.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;}
  html[dir="rtl"] .topbar .brand-text .t2{letter-spacing:.02em;text-transform:none;}
  .topbar .officer{font-size:11.5px;color:var(--muted);letter-spacing:.03em;display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .officer .dot{width:6px;height:6px;border-radius:50%;background:var(--success);flex-shrink:0;}
  .officer .otext{display:none;} @media(min-width:420px){.officer .otext{display:inline;}}
  .icon-btn{border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:.15s;position:relative;}
  .icon-btn:hover{border-color:var(--brass);color:var(--brass-dark);}
  .icon-btn:disabled{opacity:.35;cursor:not-allowed;} .icon-btn:disabled:hover{border-color:var(--line);color:var(--ink-soft);}
  .icon-btn svg{width:16px;height:16px;}
  .icon-btn.lang{width:auto;padding:0 10px;font-size:11.5px;font-weight:700;letter-spacing:.04em;gap:5px;display:flex;align-items:center;}
  .icon-btn.back-btn{color:var(--brass-dark);border-color:var(--brass-tint);background:var(--brass-tint);}
  .icon-btn.back-btn:hover{background:var(--brass);color:#fff;border-color:var(--brass);}
  html[dir="rtl"] .icon-btn.back-btn svg{transform:scaleX(-1);}

  .offline-pill{display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--danger-tint);color:var(--danger);flex-shrink:0;}
  .offline-banner{background:var(--danger-tint);color:var(--danger);font-size:12px;font-weight:600;padding:8px 18px;display:flex;align-items:center;gap:8px;}
  .paused-banner{background:var(--brass-tint);color:var(--brass-dark);font-size:12px;font-weight:600;padding:8px 18px;display:flex;align-items:center;gap:8px;}
  .patrol-timer{display:flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:3px 4px 3px 10px;flex-shrink:0;}
  .patrol-timer #patrol-timer{font-variant-numeric:tabular-nums;font-size:11.5px;font-weight:700;color:var(--ink-soft);letter-spacing:.02em;}
  .icon-btn.pause-btn{width:22px;height:22px;border:none;background:var(--ink);color:#fff;}
  .icon-btn.pause-btn svg{width:11px;height:11px;}
  .icon-btn.pause-btn.is-paused{background:var(--brass-dark);}

  .progress-rail{display:flex;align-items:center;gap:6px;padding:10px 18px 0;}
  .progress-rail .seg{flex:1;height:3px;border-radius:3px;background:var(--line);overflow:hidden;position:relative;}
  .progress-rail .seg > i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--brass-dark),var(--brass));transition:width .5s cubic-bezier(.4,0,.2,1);}
  html[dir="rtl"] .progress-rail .seg > i{background:linear-gradient(270deg,var(--brass-dark),var(--brass));margin-inline-start:auto;}
  .progress-rail .seg.done > i{width:100%;} .progress-rail .seg.active > i{width:100%;}

  main{flex:1;display:flex;flex-direction:column;padding:20px 18px 110px;max-width:640px;margin:0 auto;width:100%;}
  .crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:11.5px;color:var(--muted);letter-spacing:.03em;margin-bottom:16px;}
  .crumbs b{color:var(--ink-soft);font-weight:600;} .crumbs .sep{color:var(--line);}
  .crumbs button.crumb-link{background:none;border:none;padding:0;font:inherit;font-size:11.5px;letter-spacing:.03em;color:var(--brass-dark);font-weight:700;cursor:pointer;}
  .crumbs button.crumb-link:hover{text-decoration:underline;}
  .hint-line{font-size:11.5px;color:var(--muted);margin:-10px 0 16px;}

  .pending-panel{background:var(--danger-tint);border:1px solid #f0c9c1;border-radius:var(--radius-sm);padding:14px;margin-bottom:18px;}
  .pending-head{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--danger);margin-bottom:8px;}
  .pending-count{background:var(--danger);color:#fff;font-size:10.5px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;}
  .pending-loading{font-size:12px;color:var(--danger);opacity:.8;}
  .pending-item{background:#fff;border-radius:8px;padding:10px 12px;display:flex;align-items:center;gap:10px;margin-top:8px;}
  .pending-item-body{flex:1;min-width:0;cursor:pointer;border-radius:6px;padding:2px 4px;margin:-2px -4px;transition:.15s;}
  .pending-item-body:hover{background:var(--brass-tint);}
  .pending-item-cat{font-size:12.5px;font-weight:700;color:var(--ink);}
  .pending-item-text{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .pending-item-hint{font-size:10.5px;color:var(--brass-dark);margin-top:4px;font-weight:600;text-decoration:underline;}
  .pending-item-actions{display:flex;flex-direction:column;gap:6px;flex-shrink:0;}
  .pending-fix-btn{width:auto;padding:7px 12px;font-size:11.5px;flex-shrink:0;border-color:var(--success);color:var(--success);}
  .pending-fix-btn:hover{background:var(--success);color:#fff;}
  .pending-still-btn{width:auto;padding:7px 12px;font-size:11.5px;flex-shrink:0;}
  .pending-item-checked{font-size:10.5px;color:var(--brass-dark);margin-top:4px;font-style:italic;}
  .modal-backdrop{position:fixed;inset:0;background:rgba(20,17,13,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0;}
  .modal-card{background:var(--panel);width:100%;max-width:480px;max-height:88vh;overflow-y:auto;border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.25);}
  @media(min-width:600px){.modal-backdrop{align-items:center;padding:20px;} .modal-card{border-radius:var(--radius);max-height:80vh;}}
  .modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 18px 10px;position:sticky;top:0;background:var(--panel);}
  .modal-head h3{margin:0;font-size:16px;font-weight:700;}
  .modal-body{padding:0 18px 18px;}
  .modal-meta{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:8px;}
  .modal-desc{font-size:13.5px;color:var(--ink-soft);line-height:1.5;margin:0 0 4px;}
  .modal-desc.muted{color:var(--muted);font-style:italic;}
  .modal-media-label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:14px 0 6px;}
  .modal-media-grid{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .modal-media-item{position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;background:var(--brass-tint);flex-shrink:0;}
  .modal-media-item .modal-media-icon{color:var(--brass-dark);} .modal-media-item .modal-media-icon svg{width:22px;height:22px;}
  .modal-media-item img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .modal-submitted{font-size:11.5px;color:var(--muted);margin-top:10px;}
  .modal-actions{display:flex;gap:10px;padding:14px 18px 20px;position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);}
  .modal-actions .btn{width:auto;flex:1;}

  .page-head{margin-bottom:18px;}
  .page-head .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--brass-dark);font-weight:700;margin-bottom:6px;}
  html[dir="rtl"] .page-head .eyebrow{letter-spacing:.03em;text-transform:none;}
  .page-head h1{font-size:26px;margin:0 0 4px;font-weight:600;letter-spacing:-.01em;}
  .page-head p{margin:0;color:var(--muted);font-size:14px;line-height:1.5;}

  .login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 20px;}
  .login-card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-card);padding:36px 30px 30px;text-align:center;position:relative;}
  .login-lang{position:absolute;top:14px;inset-inline-end:14px;}
  .login-logo{width:180px;max-width:70%;margin:0 auto 22px;display:block;}
  .login-card .divider{width:34px;height:1px;background:var(--line);margin:18px auto 18px;}
  .login-card h2{font-size:15px;font-weight:600;letter-spacing:.03em;margin:0 0 2px;color:var(--ink-soft);}
  .login-card .sub{font-size:12.5px;color:var(--muted);margin:0 0 24px;letter-spacing:.02em;}
  .field{text-align:start;margin-bottom:14px;}
  .field label{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:600;}
  html[dir="rtl"] .field label{letter-spacing:0;text-transform:none;}
  .field input{width:100%;padding:13px 14px;border-radius:var(--radius-sm);border:1px solid var(--line);background:#fff;font-size:15px;color:var(--ink);outline:none;transition:.15s;letter-spacing:.02em;}
  .field input:focus{border-color:var(--brass);box-shadow:0 0 0 3px var(--brass-tint);}
  .login-error{background:var(--danger-tint);color:var(--danger);font-size:12.5px;padding:9px 12px;border-radius:8px;margin-bottom:14px;text-align:start;font-weight:500;}
  .login-note{background:var(--success-tint);color:var(--success);font-size:12.5px;padding:9px 12px;border-radius:8px;margin-bottom:14px;text-align:start;font-weight:500;}
  .btn{width:100%;padding:13px 16px;border-radius:var(--radius-sm);border:none;background:var(--ink);color:#fff;font-size:14px;font-weight:600;letter-spacing:.03em;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:8px;}
  .btn:hover{background:var(--brass-dark);} .btn:active{transform:translateY(1px);}
  .btn.brass{background:var(--brass-dark);} .btn.brass:hover{background:var(--ink);}
  .btn.ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}
  .btn.ghost:hover{border-color:var(--brass);color:var(--brass-dark);background:transparent;}
  .btn[disabled]{opacity:.45;cursor:not-allowed;} .btn[disabled]:hover{background:var(--ink);}
  .login-foot{margin-top:20px;font-size:11px;color:var(--muted);letter-spacing:.03em;}
  .switch-link{margin-top:16px;font-size:12.5px;color:var(--muted);}
  .switch-link button{background:none;border:none;color:var(--brass-dark);font-weight:700;cursor:pointer;padding:0;font-size:12.5px;text-decoration:underline;}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm);padding:16px 14px;cursor:pointer;transition:.15s;text-align:start;display:flex;flex-direction:column;gap:10px;position:relative;}
  .tile:hover{border-color:var(--brass);transform:translateY(-1px);box-shadow:var(--shadow-card);} .tile:active{transform:translateY(0);}
  .tile .ic{width:34px;height:34px;border-radius:9px;background:var(--brass-tint);color:var(--brass-dark);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .tile .ic svg{width:18px;height:18px;}
  .tile .name{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.3;}
  .tile .meta{font-size:10.5px;color:var(--muted);letter-spacing:.02em;}
  .tile .badge{position:absolute;top:10px;inset-inline-end:10px;background:var(--success);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px;}

  .tower-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px 20px;cursor:pointer;transition:.15s;text-align:start;display:flex;align-items:center;gap:16px;margin-bottom:12px;}
  .tower-card:hover{border-color:var(--brass);box-shadow:var(--shadow-card);transform:translateY(-1px);}
  .tower-card .ic{width:52px;height:52px;border-radius:12px;background:var(--brass-tint);color:var(--brass-dark);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .tower-card .ic svg{width:26px;height:26px;}
  .tower-card .name{font-size:17px;font-weight:600;font-family:'Playfair Display',serif;} html[dir="rtl"] .tower-card .name{font-family:'Cairo',serif;}
  .tower-card .meta{font-size:12px;color:var(--muted);margin-top:2px;}
  .tower-card .chev{margin-inline-start:auto;color:var(--muted);flex-shrink:0;} .tower-card .chev svg{width:18px;height:18px;}
  html[dir="rtl"] .tower-card .chev svg{transform:scaleX(-1);}

  .row-list{display:flex;flex-direction:column;gap:8px;}
  .row-tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px 16px;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .row-tile[hidden]{display:none;} .row-tile .label{text-align:start;}
  .row-tile:hover{border-color:var(--brass);} .row-tile.current{border-color:var(--brass-dark);background:var(--brass-tint);}
  .row-tile .left{display:flex;align-items:center;gap:12px;min-width:0;}
  .row-tile .num{font-family:'Playfair Display',serif;font-size:15px;color:var(--brass-dark);width:30px;height:30px;border-radius:8px;background:var(--brass-tint);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:600;}
  html[dir="rtl"] .row-tile .num{font-family:'Cairo',serif;}
  .row-tile .label{font-size:14.5px;font-weight:600;} .row-tile .chev{color:var(--muted);flex-shrink:0;} .row-tile .chev svg{width:16px;height:16px;}
  html[dir="rtl"] .row-tile .chev svg{transform:scaleX(-1);}

  .form-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-card);}
  .form-card .cat-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--line-soft);}
  .form-card .cat-head .ic{width:42px;height:42px;border-radius:10px;background:var(--brass-tint);color:var(--brass-dark);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .form-card .cat-head .ic svg{width:22px;height:22px;}
  .form-card .cat-head h3{margin:0;font-size:17px;font-weight:600;} .form-card .cat-head .loc{font-size:11.5px;color:var(--muted);margin-top:2px;}
  textarea{width:100%;min-height:100px;padding:13px 14px;border-radius:var(--radius-sm);border:1px solid var(--line);font-size:14px;resize:vertical;outline:none;transition:.15s;line-height:1.5;color:var(--ink);}
  textarea:focus{border-color:var(--brass);box-shadow:0 0 0 3px var(--brass-tint);}

  .risk-section-label{display:block;font-size:12px;font-weight:600;color:var(--ink);margin:16px 0 8px;}
  .risk-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .risk-btn{border:2px solid var(--risk);background:var(--risk-tint);color:var(--risk);border-radius:10px;padding:11px 6px;font-size:13.5px;font-weight:700;cursor:pointer;transition:.15s;}
  .risk-btn.selected{background:var(--risk);color:#fff;box-shadow:0 0 0 3px var(--risk-tint);}
  .risk-badge{display:inline-block;color:#fff;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:10px;margin-inline-start:6px;vertical-align:middle;letter-spacing:.02em;}
  .chips-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
  .chip{background:var(--brass-tint);color:var(--brass-dark);font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:20px;letter-spacing:.02em;font-family:'Playfair Display',serif;}
  html[dir="rtl"] .chip{font-family:'Cairo',serif;}

  .asset-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .asset-tile{background:var(--panel);border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:13px 14px;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:10px;text-align:start;position:relative;}
  .asset-tile:hover{border-color:var(--brass);} .asset-tile.checked{border-color:var(--brass-dark);background:var(--brass-tint);}
  .asset-tile.taken{opacity:.55;cursor:not-allowed;background:var(--line-soft);}
  .asset-tile .box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;transition:.15s;background:#fff;}
  .asset-tile.checked .box{background:var(--brass-dark);border-color:var(--brass-dark);}
  .asset-tile .box svg{width:12px;height:12px;opacity:0;transition:.15s;} .asset-tile.checked .box svg{opacity:1;}
  .asset-tile .tag{font-family:'Playfair Display',serif;font-weight:700;font-size:14.5px;} html[dir="rtl"] .asset-tile .tag{font-family:'Cairo',serif;}
  .asset-tile .logged-flag{position:absolute;top:-7px;inset-inline-end:10px;font-size:9px;background:var(--brass-dark);color:#fff;padding:2px 7px;border-radius:10px;font-weight:700;letter-spacing:.02em;}

  .assets-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;flex-wrap:wrap;}
  .skip-link{background:none;border:none;color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer;text-decoration:underline;padding:0;}
  .sel-count{font-size:12.5px;color:var(--ink-soft);font-weight:600;} .assets-foot .btn{width:auto;flex:1;max-width:220px;}

  .photo-section-label{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:14px 0 6px;}
  html[dir="rtl"] .photo-section-label{letter-spacing:0;text-transform:none;}
  .photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .photo-thumb{position:relative;border-radius:var(--radius-sm);overflow:hidden;aspect-ratio:1;border:1px solid var(--line);}
  .photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-thumb .rm{position:absolute;top:4px;inset-inline-end:4px;width:20px;height:20px;border-radius:50%;background:rgba(23,20,15,.75);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;padding:0;}
  .photo-thumb .rm svg{width:11px;height:11px;}
  .photo-add-tile{aspect-ratio:1;border-radius:var(--radius-sm);border:1.5px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;position:relative;color:var(--muted);background:#fdfcf9;transition:.15s;}
  .photo-add-tile:hover{border-color:var(--brass);} .photo-add-tile input{position:absolute;inset:0;opacity:0;cursor:pointer;}
  .photo-add-tile svg{width:19px;height:19px;} .photo-add-tile span{font-size:9.5px;font-weight:700;text-align:center;padding:0 2px;}

  .form-actions{display:flex;gap:10px;margin-top:18px;}
  .form-actions .btn.ghost{flex:0 0 auto;width:auto;padding:13px 18px;} .form-actions .btn:not(.ghost){flex:1;}

  /* bottom-left review FAB */

<div id="toast" class="toast"></div>

<script>
/* ============================================================
   DATA — edit these to match the property's real layout
   ============================================================ */
const TOWERS = [
  { id:"t1", en:"Tower 1", ar:"البرج 1", floors:26 },
  { id:"t2", en:"Tower 2", ar:"البرج 2", floors:12 },
  // Level -1 is a single area, not a tower: no floor grid, only the
  // categories listed here, and every issue carries a risk level (see
  // RISK_LEVELS). Its places are NOT listed in this file: they're loaded
  // from the spreadsheet after sign-in (see loadAreaLocations), so they
  // never appear in the public code.
  { id:"lm1", en:"Level -1", ar:"الطابق -1", floors:1, singleLevel:true, level:-1, remoteLocations:true,
    categories:["emergency-light","other"], riskScale:true },
];
// Fallback when an area's place list can't be loaded from the spreadsheet
const AREA_LOCATION = { id:"general", en:"General", ar:"عام" };
function locationsFor(tower){
  if(!tower || !tower.remoteLocations) return LOCATIONS;
  const list = state.areaLocations[tower.id];
  return list && list.length ? list : [AREA_LOCATION];
}
// Fetches the area's place names from the spreadsheet ("get-locations"),
// once per sign-in. Credentials are sent so the script only answers
// signed-in officers.
async function loadAreaLocations(tower){
  if(!tower.remoteLocations || state.areaLocations[tower.id]) return;
  const { ok, data } = await callScript("get-locations", { area: tower.en, id: state.officer, password: state.password });
  if(ok && Array.isArray(data.locations)){
    state.areaLocations[tower.id] = data.locations
      .map(n=>String(n).trim()).filter(Boolean)
      .map(n=>({ id:n, en:n, ar:n }));
  }
}
/* Risk scale shown on Level -1 issues. `color` is the button / badge colour in
   the app; the Apps Script uses the same colours to highlight the
   "Risk Level" cell in the spreadsheet (apps-script/risk-level.gs). */
const RISK_LEVELS = [
  { id:"Regular", en:"Regular", ar:"عادي",  color:"#2e7d32", tint:"#e3f1e4" },
  { id:"Medium",  en:"Medium",  ar:"متوسط", color:"#b26a00", tint:"#fdf0d5" },
  { id:"Risky",   en:"Risky",   ar:"خطير",  color:"#c62828", tint:"#fbe4e2" },
];
const DEFAULT_RISK = "Regular";
function riskOf(id){ return RISK_LEVELS.find(r=>r.id===id) || null; }
function riskBadge(id){
  const r = riskOf(id); if(!r) return "";
  return `<span class="risk-badge" style="background:${r.color}">${tr(r)}</span>`;
}
function categoriesFor(tower){ return tower && tower.categories ? CATEGORIES.filter(c=>tower.categories.includes(c.id)) : CATEGORIES; }
const LOCATIONS = [
  { id:"corridor", en:"Corridor", ar:"الممر" },
  { id:"guest-elevator", en:"Guest Lift", ar:"مصعد النزلاء" },
  { id:"workers-elevator", en:"Service Lift", ar:"مصعد الخدمة" },
  { id:"pantry-loc", en:"Pantry", ar:"المطبخ الصغير" },
  { id:"core-1", en:"Core 1", ar:"النواة 1" },
  { id:"core-2", en:"Core 2", ar:"النواة 2" },
];
const CATEGORIES = [
  { id:"emergency-light", en:"Emergency Light", ar:"إضاءة الطوارئ", icon:"bulb" },
  { id:"fire-doors",      en:"Fire Doors", ar:"أبواب الحريق", icon:"door" },
  { id:"spot-light",      en:"Spot Light", ar:"كشاف إضاءة", icon:"spot" },
  { id:"fluorescent",     en:"Fluorescent Light", ar:"إضاءة فلورسنت", icon:"tube" },
  { id:"walls",           en:"Walls (Paint / Crack)", ar:"الجدران (دهان / تشقق)", icon:"wall" },
  { id:"door-frame",      en:"Doors & Wall Frame", ar:"الأبواب وإطارات الجدران", icon:"frame" },
  { id:"fire-cabinet",    en:"Fire Cabinet", ar:"خزانة الحريق", icon:"cabinet" },
  { id:"pantry",          en:"Pantry", ar:"المطبخ الصغير", icon:"pantry" },
  { id:"electrical",      en:"Electrical", ar:"كهرباء", icon:"bolt" },
  { id:"shaft-room",      en:"Shaft Room", ar:"غرفة الشافت", icon:"shaft" },
  { id:"other",           en:"Other Issue", ar:"مشكلة أخرى", icon:"alert" },
];
/* Real unit numbering, pulled directly from the property's own monthly
   check sheets (Emergency Lights Monthly Checks / Fire Doors Task):
     - Emergency Lights: EML 01–13 on every corridor floor
         Tower 1: floors 3–25   Tower 2: floors 3–12
     - Fire Doors: Tower 1 has 11 per floor (D01–D11)
                   Tower 2 has 10 per floor (D01–D10)
                   same floor ranges as above
   Ground floor / basement / mezzanine doors (the property's own "L0",
   "L1", "L2" sheets) use a different room-number scheme entirely and
   aren't included here yet — ask if those should be added too. */
function padded_(n){ return String(n).padStart(2,"0"); }
const ASSET_REGISTRY = {};
for (let lvl = 3; lvl <= 25; lvl++) {
  ASSET_REGISTRY[`t1|${lvl}|emergency-light`] = Array.from({length:13}, (_,i)=>`EML ${padded_(i+1)}`);
  ASSET_REGISTRY[`t1|${lvl}|fire-doors`]      = Array.from({length:11}, (_,i)=>`D${padded_(i+1)}`);
}
for (let lvl = 3; lvl <= 12; lvl++) {
  // Tower 2 emergency lights use the property's own floor/number labels
  // (e.g. "3/3", "4/3"), not the "EML 0X" naming from the file
  ASSET_REGISTRY[`t2|${lvl}|emergency-light`] = Array.from({length:12}, (_,i)=>`${lvl}/${i+1}`);
  ASSET_REGISTRY[`t2|${lvl}|fire-doors`]      = Array.from({length:10}, (_,i)=>`D${padded_(i+1)}`);
}
function getAssets(towerId, level, categoryId){ return ASSET_REGISTRY[`${towerId}|${level}|${categoryId}`] || null; }

/* STANDALONE build, now connected to a real Google Sheet via Apps Script.
   Register, sign-in, and every submitted issue (with photos) are written
   straight into that spreadsheet. */
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxT-WlE3AKajPWhKNF2Tu12qFdft2LhzWcSOlwaZVKCEAUmoK7aUPyV-qUMlI0wmZ-9/exec";

async function callScript(action, payload){
  try{
    const res = await fetch(GOOGLE_SCRIPT_URL, {
      method: "POST",
      // text/plain avoids a CORS preflight that Apps Script web apps don't handle;
      // the script itself still JSON.parses the body normally.
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action, ...payload }),
    });
    const data = await res.json().catch(()=>({}));
    return { ok: res.ok && data.ok !== false, data };
  }catch(e){
    return { ok:false, data:{ error: t("networkError") } };
  }
}
async function callScriptGet(params){
  try{
    const qs = new URLSearchParams(params).toString();
    const res = await fetch(`${GOOGLE_SCRIPT_URL}?${qs}`);
    const data = await res.json().catch(()=>({}));
    return { ok: res.ok, data };
  }catch(e){
    return { ok:false, data:{} };
  }
}

/* ============================================================
   OFFLINE QUEUE — a patrol submitted with no connection is saved on the
   device (localStorage) instead of lost, and gets pushed to the sheet
   automatically the moment connectivity comes back.
   ============================================================ */
const OFFLINE_QUEUE_KEY = "fls_offline_queue";
function getOfflineQueue(){ try{ return JSON.parse(localStorage.getItem(OFFLINE_QUEUE_KEY) || "[]"); }catch(e){ return []; } }
function setOfflineQueue(q){ try{ localStorage.setItem(OFFLINE_QUEUE_KEY, JSON.stringify(q)); }catch(e){ /* storage unavailable — nothing more we can do */ } }
function queueOffline(officer, entries){
  const q = getOfflineQueue();
  q.push({ officer, entries, queuedAt: new Date().toISOString() });
  setOfflineQueue(q);
}
let flushingOffline = false;
async function flushOfflineQueue(){
  if(flushingOffline || !navigator.onLine) return;
  const queue = getOfflineQueue();
  if(!queue.length) return;
  flushingOffline = true;
  const remaining = [];
  let flushed = 0;
  for(const item of queue){
    const { ok } = await callScript("submit-patrol", { officer:item.officer, entries:item.entries });
    if(ok) flushed++; else remaining.push(item);
  }
  setOfflineQueue(remaining);
  flushingOffline = false;
  if(flushed) toast(t("offlineFlushed", flushed));
  if(state.screen!=="login" && state.screen!=="register") render();
}
window.addEventListener("online", ()=>{ state.isOnline = true; flushOfflineQueue(); render(); });
window.addEventListener("offline", ()=>{ state.isOnline = false; render(); });

/* ============================================================
   PHOTO COMPRESSION — shrinks an image file client-side (resize + JPEG
   re-encode) before it's turned into base64 and sent anywhere, so a
   multi-megabyte phone photo becomes a few hundred KB.
   ============================================================ */
function compressImageFile(file, maxDim=1024, quality=0.7){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=> reject(new Error("read failed"));
    reader.onload = ev=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error("decode failed"));
      img.onload = ()=>{
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale); height = Math.round(height * scale);
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}
function readFileAsDataUrl(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=> reject(new Error("read failed"));
    reader.onload = ()=> resolve(reader.result);
    reader.readAsDataURL(file);
  });
}

/* ============================================================
   PATROL TIMER — pause/resume, logged to the Patrol Timer Log sheet.
   The visible clock updates on its own 1-second tick so it doesn't need
   a full screen re-render just to keep counting.
   ============================================================ */
function startPatrolSession(){
  state.patrol = { sessionId: "PAT-"+Date.now(), startedAt: Date.now(), paused:false, lastPauseAt:null, pausedMs:0 };
  callScript("log-patrol-event", { officer: state.officer, sessionId: state.patrol.sessionId, event:"Start", timestamp: new Date().toISOString() });
}
function togglePatrolPause(){
  const p = state.patrol;
  if(!p.sessionId) return;
  if(!p.paused){
    p.paused = true; p.lastPauseAt = Date.now();
    callScript("log-patrol-event", { officer: state.officer, sessionId: p.sessionId, event:"Pause", timestamp: new Date().toISOString() });
  } else {
    const pauseDurationMs = Date.now() - p.lastPauseAt;
    p.pausedMs += pauseDurationMs;
    p.paused = false; p.lastPauseAt = null;
    callScript("log-patrol-event", { officer: state.officer, sessionId: p.sessionId, event:"Resume", timestamp: new Date().toISOString(), pauseDurationMs, pauseDuration: formatDuration(pauseDurationMs) });
  }
  render();
}
function formatElapsed(ms){
  const total = Math.max(0, Math.floor(ms/1000));
  const h = Math.floor(total/3600);
  const m = String(Math.floor((total%3600)/60)).padStart(2,"0");
  const s = String(total%60).padStart(2,"0");
  return h>0 ? `${h}:${m}:${s}` : `${m}:${s}`;
}
// Friendlier "1h 05m" / "12m 30s" form, used for the logout summary and the
// values sent to the sheet — formatElapsed above stays mm:ss (or h:mm:ss)
// for the live ticking clock in the topbar.
function formatDuration(ms){
  const total = Math.max(0, Math.floor(ms/1000));
  const h = Math.floor(total/3600);
  const m = Math.floor((total%3600)/60);
  const s = total%60;
  if(h>0) return `${h}h ${String(m).padStart(2,"0")}m`;
  if(m>0) return `${m}m ${String(s).padStart(2,"0")}s`;
  return `${s}s`;
}
setInterval(()=>{
  const el = document.getElementById("patrol-timer");
  const p = state.patrol;
  if(!el || !p.sessionId) return;
  const extra = p.paused ? (Date.now() - p.lastPauseAt) : 0;
  el.textContent = formatElapsed(Date.now() - p.startedAt - p.pausedMs - extra);
}, 1000);

let state = {
  screen: "login", lang: "en", officer: null, loginError:"", registerError:"", registerNote:"",
  tower:null, level:null, location:null, activeCategory:null, password:null, areaLocations:{}, locationFilter:"",
  selectedAssets:[], reportedTags:[], reportedIssues:[], checkingAssets:false,
  draft:{text:"", media:[], risk:DEFAULT_RISK}, reports:[], sending:false, lastSkipped:0, lastSaved:0,
  patrol:{ sessionId:null, startedAt:null, paused:false, lastPauseAt:null, pausedMs:0 },
  pendingIssues:[], pendingLoading:false, viewingIssue:null,
  isOnline: (typeof navigator!=="undefined" ? navigator.onLine : true),
  lastQueuedOffline:0, offlineSuccess:false,
};

function toast(msg, warn){
  const el = document.getElementById("toast");
  el.className = "toast" + (warn?" warn":"");
  el.innerHTML = icon(warn?"x":"check") + `<span>${msg}</span>`;
  el.classList.add("show");
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>el.classList.remove("show"), 2600);
}
function go(screen){ state.screen = screen; render(); window.scrollTo({top:0,behavior:"instant"}); }
function canGoBack(){ return ["tower","level","location","category","assets","form","summary"].includes(state.screen); }
function goBack(){
  switch(state.screen){
    case "tower": go("login"); break;
    case "level": go("tower"); break;
    case "location": go(state.tower.singleLevel ? "tower" : "level"); break;
    case "category": go("location"); break;
    case "assets": go("category"); break;
    case "form": go(getAssets(state.tower.id,state.level,state.activeCategory) ? "assets" : "category"); break;
    case "summary": go(state.location?"category":state.level!=null?"location":state.tower?"level":"tower"); break;
    default: break;
  }
}
// Jumps straight from one level to another (used by the Select Level grid
// AND the "Next Level" shortcut) without forcing the officer back through
// the Level grid each time.
async function selectLevel(n){
  state.level = n;
  state.locationFilter = "";
  go("location");
  state.pendingLoading = true; state.pendingIssues = [];
  if(state.screen==="location") render();
  const [{ ok, data }] = await Promise.all([
    callScript("pending-issues", { tower: state.tower.en, floor: state.level }),
    loadAreaLocations(state.tower),
  ]);
  state.pendingLoading = false;
  state.pendingIssues = (ok && data.pending) ? data.pending : [];
  if(state.screen==="location") render();
}

   RENDER
   ============================================================ */
function render(){
  document.documentElement.dir = state.lang==="ar" ? "rtl" : "ltr";
  document.documentElement.lang = state.lang;
  document.getElementById("app").innerHTML = ({
    login: renderLogin, tower: renderTower, level: renderLevel,
    location: renderLocation, category: renderCategory, assets: renderAssets, form: renderForm,
    summary: renderSummary, success: renderSuccess,
  })[state.screen]() + renderIssueDetailModal();
  bindEvents();
}

}
function reviewFab(){
  if(["login","register","success"].includes(state.screen)) return "";
  const n = state.reports.length;
  // always tappable, even at 0 — opens the review screen either way so it's
  // obvious how to check what's been logged, instead of looking dead/greyed out
  return `<button class="review-fab" id="btn-review" title="${t('reviewFinish')}">${icon("clip")}${n?`<span class="n">${n}</span>`:""}</button>`;
}
function crumbTrail({tower, floor, location}={}){
  const parts = [];
  if(state.tower && state.tower.singleLevel){
    parts.push(floor==="current" ? `<b>${tr(state.tower)}</b>` : `<button class="crumb-link" data-jump="location">${tr(state.tower)}</button>`);
    if(state.location && location!==undefined) parts.push(location==="current" ? `<b>${tr(state.location)}</b>` : `<button class="crumb-link" data-jump="location">${tr(state.location)}</button>`);
    return `<div class="crumbs">${parts.join('<span class="sep">/</span>')}</div>`;
  }
  if(state.tower) parts.push(tower==="current" ? `<b>${tr(state.tower)}</b>` : `<button class="crumb-link" data-jump="tower">${tr(state.tower)}</button>`);
  if(state.level!=null && floor!==undefined) parts.push(floor==="current" ? `<b>${t("floorLabel",state.level)}</b>` : `<button class="crumb-link" data-jump="level">${t("floorLabel",state.level)}</button>`);
  if(state.location && location!==undefined) parts.push(location==="current" ? `<b>${tr(state.location)}</b>` : `<button class="crumb-link" data-jump="location">${tr(state.location)}</button>`);
  return `<div class="crumbs">${parts.join('<span class="sep">/</span>')}</div>`;
}

function renderTower(){
  return topbar(0,4) + `
  <main>
    <div class="page-head"><div class="eyebrow">${t("stepOf",1,4)}</div><h1>${t("towerTitle")}</h1><p>${t("towerSub")}</p></div>
    ${TOWERS.map(tw=>`
      <button class="tower-card" data-tower="${tw.id}">
        <div class="ic">${icon("tower")}</div>
        <div><div class="name">${tr(tw)}</div><div class="meta">${tw.singleLevel ? t("areaMeta") : t("towerFloors",tw.floors)}</div></div>
        <div class="chev">${icon("chevron")}</div>
      </button>`).join("")}
  </main>` + reviewFab();
}

function renderLevel(){
  const floors = Array.from({length: state.tower.floors}, (_,i)=>i+1);
  return topbar(1,4) + `
  <main>
    ${crumbTrail({tower:"current"})}
    <div class="page-head"><div class="eyebrow">${t("stepOf",2,4)}</div><h1>${t("levelTitle")}</h1><p>${t("levelSub")}</p></div>
    <div class="row-list">
      ${floors.map(n=>`
        <button class="row-tile ${state.level===n?'current':''}" data-level="${n}">
          <div class="left"><div class="num">${String(n).padStart(2,"0")}</div><div class="label">${t("floorLabel",n)}</div></div>
          <div class="chev">${icon("chevron")}</div>
        </button>`).join("")}
    </div>
  </main>` + reviewFab();
}

function renderPendingPanel(){
  if(state.pendingLoading){
    return `<div class="pending-panel"><div class="pending-head">${icon("alert",'style="width:15px;height:15px"')} ${t("pendingTitle")}</div><div class="pending-loading">${t("pendingLoading")}</div></div>`;
  }
  if(!state.pendingIssues.length) return "";
  return `
  <div class="pending-panel">
    <div class="pending-head">${icon("alert",'style="width:15px;height:15px"')} ${t("pendingTitle")} <span class="pending-count">${state.pendingIssues.length}</span></div>
    ${state.pendingIssues.map(p=>{
      const cat = CATEGORIES.find(c=>c.id===p.category);
      const checkedNote = p.lastCheckedBy ? t("lastChecked", p.lastCheckedBy, p.lastCheckedAt ? new Date(p.lastCheckedAt).toLocaleString() : "") : "";
      return `
      <div class="pending-item">
        <div class="pending-item-body" data-view-issue="${p.issueId}">
          <div class="pending-item-cat">${cat?tr(cat):p.category}${p.location?` · ${p.location}`:""}${p.assets?` · ${p.assets}`:""}${riskBadge(p.risk)}</div>
          ${p.text?`<div class="pending-item-text">${escapeHtml(p.text)}</div>`:""}
          ${checkedNote?`<div class="pending-item-checked">${checkedNote}</div>`:""}
          <div class="pending-item-hint">${t("viewDetails")}</div>
        </div>
        <div class="pending-item-actions">
          <button class="btn ghost pending-fix-btn" data-fix-issue="${p.issueId}">${t("markFixed")}</button>
          <button class="btn ghost pending-still-btn" data-pending-issue="${p.issueId}">${t("markPending")}</button>
        </div>
      </div>`;
    }).join("")}
  </div>`;
}

function renderAreaLocation(){
  const places = locationsFor(state.tower);
  const q = state.locationFilter.toLowerCase();
  return topbar(2,4) + `
  <main>
    ${crumbTrail({floor:"current"})}
    <div class="page-head"><div class="eyebrow">${t("stepOf",3,4)}</div><h1>${t("locationTitle")}</h1><p>${t("locationSub")}</p></div>
    ${renderPendingPanel()}
    <div class="field"><input type="search" id="in-place-filter" placeholder="${t("searchPlaces")}" value="${escapeHtml(state.locationFilter)}" autocomplete="off" /></div>
    <div class="row-list">
      ${places.map(loc=>`
        <button class="row-tile" data-location="${escapeHtml(loc.id)}" ${q && !tr(loc).toLowerCase().includes(q) ? 'hidden' : ''}>
          <div class="left"><div class="label">${escapeHtml(tr(loc))}</div></div>
          <div class="chev">${icon("chevron")}</div>
        </button>`).join("")}
    </div>
  </main>` + reviewFab();
}

function renderLocation(){
  if(state.tower.singleLevel) return renderAreaLocation();
  const hasNextLevel = state.level < state.tower.floors;
  return topbar(2,4) + `
  <main>
    ${crumbTrail({tower:"link", floor:"current"})}
    <div class="page-head"><div class="eyebrow">${t("stepOf",3,4)}</div><h1>${t("locationTitle")}</h1><p>${t("locationSub")}</p></div>
    ${renderPendingPanel()}
    <div class="grid">
      ${LOCATIONS.map(loc=>`
        <button class="tile" data-location="${loc.id}">
          <div class="ic">${icon("frame")}</div>
          <div><div class="name">${tr(loc)}</div><div class="meta">${t("floorLabel",state.level)}</div></div>
        </button>`).join("")}
    </div>
    ${hasNextLevel ? `
    <div class="assets-foot" style="justify-content:center">
      <button class="btn ghost" id="btn-next-level">${t("nextLevel", state.level+1)} ${icon("chevron")}</button>
    </div>` : `<div class="hint-line" style="text-align:center;margin-top:16px">${t("topOfTower")}</div>`}
  </main>` + reviewFab();
}

function renderCategory(){
  const counts = {};
  state.reports.forEach(r=>{ if(r.towerId===state.tower.id && r.level===state.level && r.locationId===state.location.id) counts[r.category] = (counts[r.category]||0)+1; });
  return topbar(3,4) + `
  <main>
    ${crumbTrail({tower:"link", floor:"link", location:"current"})}
    ${state.tower.singleLevel ? "" : `<div class="hint-line">${t("changeFloor")}</div>`}
    <div class="page-head"><div class="eyebrow">${t("stepOf",4,4)}</div><h1>${t("categoryTitle")}</h1><p>${t("categorySub")}</p></div>
    <div class="grid">
      ${categoriesFor(state.tower).map(c=>`
        <button class="tile" data-category="${c.id}">
          ${counts[c.id]?`<div class="badge">${counts[c.id]}</div>`:""}
          <div class="ic">${icon(c.icon)}</div><div><div class="name">${tr(c)}</div></div>
        </button>`).join("")}
    </div>
  </main>` + reviewFab();
}

function renderFlaggedIssuesPanel(matches){
  return `
  <div class="pending-panel">
    <div class="pending-head">${icon("alert",'style="width:15px;height:15px"')} ${t("flaggedTitle")} <span class="pending-count">${matches.length}</span></div>
    ${matches.map(m=>{
      const checkedNote = m.lastCheckedBy ? t("lastChecked", m.lastCheckedBy, m.lastCheckedAt ? new Date(m.lastCheckedAt).toLocaleString() : "") : "";
      return `
      <div class="pending-item">
        <div class="pending-item-body" data-view-issue="${m.issueId}">
          <div class="pending-item-cat">${m.tags.join(", ")}</div>
          ${m.text?`<div class="pending-item-text">${escapeHtml(m.text)}</div>`:""}
          ${checkedNote?`<div class="pending-item-checked">${checkedNote}</div>`:""}
          <div class="pending-item-hint">${t("viewDetails")}</div>
        </div>
        <div class="pending-item-actions">
          <button class="btn ghost pending-fix-btn" data-fix-issue="${m.issueId}">${t("markFixed")}</button>
          <button class="btn ghost pending-still-btn" data-pending-issue="${m.issueId}">${t("markPending")}</button>
        </div>
      </div>`;
    }).join("")}
  </div>`;
}

function renderAssets(){
  const cat = CATEGORIES.find(c=>c.id===state.activeCategory);
  const assets = getAssets(state.tower.id, state.level, state.activeCategory) || [];

  // tags already covered by an existing OPEN issue (someone already
  // submitted this one) — these get pulled out of the pick-a-unit grid
  // entirely and offered Fixed/Pending only, no write-up needed
  const flaggedTagSet = new Set();
  (state.reportedIssues||[]).forEach(m => m.tags.forEach(tag => flaggedTagSet.add(tag)));
  const openAssets = assets.filter(tag => !flaggedTagSet.has(tag));

  // purely informational — a tag the officer already logged a *new* report
  // for earlier in this same visit (different from an existing sheet issue)
  const loggedThisVisit = new Set();
  state.reports.forEach(r=>{
    if(r.towerId===state.tower.id && r.level===state.level && r.locationId===state.location.id && r.category===state.activeCategory){
      (r.assets||[]).forEach(a=>loggedThisVisit.add(a));
    }
  });

  return topbar(3,4) + `
  <main>
    ${crumbTrail({tower:"link", floor:"link", location:"link"})}
    <div class="page-head"><div class="eyebrow">${tr(cat)}</div><h1>${t("assetsTitle")}</h1>
      <p>${state.checkingAssets? t("checkingUnits") : t("assetsSub")}</p></div>

    ${state.reportedIssues && state.reportedIssues.length ? renderFlaggedIssuesPanel(state.reportedIssues) : ""}

    ${openAssets.length ? `
    <div class="asset-grid">
      ${openAssets.map(tag=>{
        const loggedNow = loggedThisVisit.has(tag);
        return `

function escapeHtml(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

/* ============================================================
   ISSUE DETAIL MODAL — lets an officer standing at a flagged spot open
   the full write-up (description + every photo/video) before deciding
   Fixed vs Still Pending, instead of judging off the one-line summary.
   ============================================================ */
function driveFileId_(url){
  const m = /\/d\/([^/]+)/.exec(url||"") || /[?&]id=([^&]+)/.exec(url||"");
  return m ? m[1] : null;
}
function findIssueById_(issueId){
  return (state.pendingIssues||[]).find(p=>p.issueId===issueId)
      || (state.reportedIssues||[]).find(m=>m.issueId===issueId)
      || null;
}
function renderIssueDetailModal(){
  const iss = state.viewingIssue;
  if(!iss) return "";
  const cat = CATEGORIES.find(c=>c.id===iss.category);
  const mediaUrls = String(iss.media||"").split(",").map(s=>s.trim()).filter(Boolean);
  const tagsLabel = iss.tags && iss.tags.length ? iss.tags.join(", ") : (iss.assets || "");
  const metaParts = [iss.location, tagsLabel].filter(Boolean);
  const checkedNote = iss.lastCheckedBy ? t("lastChecked", iss.lastCheckedBy, iss.lastCheckedAt ? new Date(iss.lastCheckedAt).toLocaleString() : "") : "";
  const submittedWhen = iss.submittedAt ? new Date(iss.submittedAt).toLocaleString() : "";
  return `
  <div class="modal-backdrop" id="issue-modal-backdrop">
    <div class="modal-card">
      <div class="modal-head">
        <h3>${cat?tr(cat):(iss.category||"")}${riskBadge(iss.risk)}</h3>
        <button class="icon-btn" id="btn-close-issue-modal" title="${t('close')}">${icon("x")}</button>
      </div>
      <div class="modal-body">
        ${metaParts.length?`<div class="modal-meta">${metaParts.join(" · ")}</div>`:""}
        ${iss.text?`<p class="modal-desc">${escapeHtml(iss.text)}</p>`:`<p class="modal-desc muted">${t("noDescription")}</p>`}
        <div class="modal-media-label">${t("photoLabel")}</div>
        ${mediaUrls.length ? `
        <div class="modal-media-grid">
          ${mediaUrls.map(url=>{
            const fid = driveFileId_(url);
            const thumb = fid ? `https://drive.google.com/thumbnail?id=${fid}&sz=w400` : "";
            return `<a class="modal-media-item" href="${url}" target="_blank" rel="noopener" title="${t('openAttachment')}">
              <span class="modal-media-icon">${icon("camera")}</span>
              ${thumb?`<img src="${thumb}" alt="" loading="lazy" onerror="this.style.display='none'" />`:""}
            </a>`;
          }).join("")}
        </div>` : `<div class="hint-line">${t("noMedia")}</div>`}
        <div class="modal-submitted">${t("submittedBy", iss.officer||"", submittedWhen)}</div>
        ${checkedNote?`<div class="pending-item-checked">${checkedNote}</div>`:""}
      </div>
      <div class="modal-actions">
        <button class="btn ghost pending-fix-btn" data-fix-issue="${iss.issueId}">${t("markFixed")}</button>
        <button class="btn ghost pending-still-btn" data-pending-issue="${iss.issueId}">${t("markPending")}</button>
      </div>
    </div>
  </div>`;
}

/* ============================================================
   LOGOUT — shared by the logout button AND the phone/browser back-button
   trap below, so both paths ask the same yes/no question and log the
   same total-time summary before actually signing out.
   Returns true if the officer confirmed and was logged out, false if
   they cancelled (and are still signed in).
   ============================================================ */
function confirmAndLogout(){
  const logoutMsg = state.reports.length ? t("logoutConfirm") : t("logoutConfirmSimple");
  if(!confirm(logoutMsg)) return false;
  const p = state.patrol;
  if(p.sessionId){
    // Total patrol time = logout minus login, minus every pause (including
    // one that's still active right at the moment of logout).
    const activePauseMs = p.paused ? (Date.now() - p.lastPauseAt) : 0;
    const totalPausedMs = p.pausedMs + activePauseMs;
    const totalDurationMs = Math.max(0, Date.now() - p.startedAt - totalPausedMs);
    callScript("log-patrol-event", {
      officer: state.officer, sessionId: p.sessionId, event:"Logout", timestamp: new Date().toISOString(),
      totalDurationMs, totalDuration: formatDuration(totalDurationMs),
      totalPausedMs, totalPaused: formatDuration(totalPausedMs),
    });
    toast(totalPausedMs>0
      ? t("logoutSummaryPaused", formatDuration(totalDurationMs), formatDuration(totalPausedMs))
      : t("logoutSummary", formatDuration(totalDurationMs)));
  }
  state = {screen:"login", lang:state.lang, officer:null, loginError:"", registerError:"", registerNote:"", tower:null, level:null, location:null, activeCategory:null, selectedAssets:[], reportedTags:[], reportedIssues:[], checkingAssets:false, draft:{text:"",media:[],risk:DEFAULT_RISK}, reports:[], sending:false, lastSkipped:0, lastSaved:0, patrol:{sessionId:null,startedAt:null,paused:false,lastPauseAt:null,pausedMs:0}, pendingIssues:[], pendingLoading:false, viewingIssue:null, isOnline:state.isOnline, lastQueuedOffline:0, offlineSuccess:false};
  render();
  return true;
}

function bindEvents(){
  const $ = sel => document.querySelector(sel);
  const $$ = sel => document.querySelectorAll(sel);

  $$("#btn-lang").forEach(b=>b.addEventListener("click", ()=>{ state.lang = state.lang==="en" ? "ar" : "en"; render(); }));

  // passwords are numbers-only — strip anything else as it's typed
  $$('input[id="in-pw"], input[id="reg-pw"], input[id="reg-pw2"]').forEach(inp=>{
    inp.addEventListener("input", ()=>{ inp.value = inp.value.replace(/\D/g, ""); });
  });

  if(state.screen==="login"){
    $("#login-form").addEventListener("submit", async e=>{
      e.preventDefault();
      const id = $("#in-id").value.trim(); const pw = $("#in-pw").value;
      const btn = $("#btn-login-submit"); btn.disabled = true; btn.innerHTML = `<span class="spinner"></span>`;
      const { ok, data } = await callScript("login", { id, password: pw });
      if(ok){ state.officer = id; state.password = pw; state.loginError=""; state.registerNote=""; go("tower"); }
      else { state.loginError = (data && data.error) || t("loginErrorMsg"); render(); $("#in-pw").focus(); }
    });
  }

  const backBtn = $("#btn-global-back");
  if(backBtn && !backBtn.disabled) backBtn.addEventListener("click", goBack);

  const pauseBtn = $("#btn-toggle-pause");
  if(pauseBtn) pauseBtn.addEventListener("click", togglePatrolPause);

  const logoutBtn = $("#btn-logout");
  if(logoutBtn) logoutBtn.addEventListener("click", confirmAndLogout);

  const reviewBtn = $("#btn-review");
  if(reviewBtn) reviewBtn.addEventListener("click", ()=> go("summary"));

  // Fixed/Pending buttons can appear on the Location screen (floor-wide
  // checklist) AND the Assets screen (one specific already-reported unit)
  // — one shared handler, updates whichever list actually has the item.
  $$("[data-fix-issue]").forEach(b=>b.addEventListener("click", async ()=>{
    const issueId = b.dataset.fixIssue;
    if(!confirm(t("fixedConfirm"))) return;
    b.disabled = true; b.textContent = "…";
    const { ok, data } = await callScript("update-issue-status", { issueId, officer: state.officer, status:"Done" });
    if(ok){
      state.pendingIssues = state.pendingIssues.filter(p=>p.issueId!==issueId);
      state.reportedIssues = state.reportedIssues.filter(m=>m.issueId!==issueId);
      if(state.viewingIssue && state.viewingIssue.issueId===issueId) state.viewingIssue = null;
      toast(t("fixedDone"));
    } else {
      toast((data && data.error) || t("networkError"), true);
    }
    render();
  }));
  $$("[data-pending-issue]").forEach(b=>b.addEventListener("click", async ()=>{
    const issueId = b.dataset.pendingIssue;
    if(!confirm(t("pendingConfirm"))) return;
    b.disabled = true; b.textContent = "…";
    const { ok, data } = await callScript("update-issue-status", { issueId, officer: state.officer, status:"Pending" });
    if(ok){
      const now = new Date().toISOString();
      const p1 = state.pendingIssues.find(p=>p.issueId===issueId); if(p1){ p1.lastCheckedBy = state.officer; p1.lastCheckedAt = now; }
      const p2 = state.reportedIssues.find(m=>m.issueId===issueId); if(p2){ p2.lastCheckedBy = state.officer; p2.lastCheckedAt = now; }
      if(state.viewingIssue && state.viewingIssue.issueId===issueId) state.viewingIssue = null;
      toast(t("pendingDone"));
    } else {
      toast((data && data.error) || t("networkError"), true);
    }
    render();
  }));

  $$("[data-jump]").forEach(b=>b.addEventListener("click", ()=>{
    const j = b.dataset.jump;
    if(j==="tower") go("tower"); if(j==="level") go("level"); if(j==="location") go("location");
  }));

  // Issue detail modal — tapping a pending/flagged item's body (not its
  // Fixed/Pending buttons) opens the full write-up with photos/videos.
  $$("[data-view-issue]").forEach(b=>b.addEventListener("click", ()=>{
    const found = findIssueById_(b.dataset.viewIssue);
    if(found){ state.viewingIssue = found; render(); }
  }));
  const closeIssueModalBtn = $("#btn-close-issue-modal");
  if(closeIssueModalBtn) closeIssueModalBtn.addEventListener("click", ()=>{ state.viewingIssue = null; render(); });
  const issueModalBackdrop = $("#issue-modal-backdrop");
  if(issueModalBackdrop) issueModalBackdrop.addEventListener("click", (e)=>{
    if(e.target.id==="issue-modal-backdrop"){ state.viewingIssue = null; render(); }
  });

  if(state.screen==="tower"){
    $$("[data-tower]").forEach(b=>b.addEventListener("click", ()=>{
      state.tower = TOWERS.find(x=>x.id===b.dataset.tower);
      if(!state.patrol.sessionId) startPatrolSession(); // first tower pick of this patrol starts the clock
      if(state.tower.singleLevel) selectLevel(state.tower.level); else go("level");
    }));
  }
  if(state.screen==="level"){
    $$("[data-level]").forEach(b=>b.addEventListener("click", ()=> selectLevel(Number(b.dataset.level))));
  }
  if(state.screen==="location"){
    $$("[data-location]").forEach(b=>b.addEventListener("click", ()=>{ state.location = locationsFor(state.tower).find(x=>x.id===b.dataset.location); go("category"); }));
    // filters in place (no re-render) so the search box keeps focus
    const placeFilter = $("#in-place-filter");
    if(placeFilter) placeFilter.addEventListener("input", e=>{
      state.locationFilter = e.target.value;
      const q = state.locationFilter.toLowerCase();
      $$("[data-location]").forEach(b=>{ b.hidden = !!q && !b.textContent.toLowerCase().includes(q); });
    });
    const nextLevelBtn = $("#btn-next-level");
    if(nextLevelBtn) nextLevelBtn.addEventListener("click", ()=> selectLevel(state.level+1));
  }
  if(state.screen==="category"){
    $$("[data-category]").forEach(b=>b.addEventListener("click", async ()=>{
      state.activeCategory = b.dataset.category;
      state.draft = {text:"", media:[], risk:DEFAULT_RISK};
      state.selectedAssets = [];
      state.reportedTags = []; state.reportedIssues = [];
      const assets = getAssets(state.tower.id, state.level, state.activeCategory);
      if(assets && assets.length){
        state.checkingAssets = true;
        go("assets");
        // check the real spreadsheet for units that already have an open
        // report from a past patrol — those get pulled OUT of the normal
        // pick-and-describe grid entirely and offered as a direct
        // Fixed/Pending choice instead (see renderAssets)
        const { ok, data } = await callScript("check-duplicates", { tower:state.tower.en, floor:state.level, location:state.location.id, category:state.activeCategory, assets: assets.join(",") });
        state.checkingAssets = false;
        if(ok){
          state.reportedTags = data.duplicates || [];
          state.reportedIssues = data.matches || [];
        }
        if(state.screen==="assets") render();
      } else { go("form"); }
    }));
  }
  if(state.screen==="assets"){
    $$("[data-asset]").forEach(b=>b.addEventListener("click", ()=>{
      const tag = b.dataset.asset; const idx = state.selectedAssets.indexOf(tag);
      if(idx>-1) state.selectedAssets.splice(idx,1); else state.selectedAssets.push(tag);
      render();
    }));
    $("#btn-skip-assets").addEventListener("click", ()=>{ state.selectedAssets=[]; go("form"); });
    const cont = $("#btn-assets-continue");
    if(cont) cont.addEventListener("click", ()=>{ if(state.selectedAssets.length) go("form"); });
  }
  if(state.screen==="form"){
    $("#btn-cancel-form").addEventListener("click", ()=>go("category"));
    $("#in-desc").addEventListener("input", e=> state.draft.text = e.target.value);
    $$("[data-risk]").forEach(b=>b.addEventListener("click", ()=>{ state.draft.risk = b.dataset.risk; render(); }));

    // camera photo — resized + re-encoded before it ever becomes base64
    $("#in-photo").addEventListener("change", async e=>{
      const file = e.target.files[0]; if(!file) return;
      try{ const url = await compressImageFile(file); state.draft.media.push({kind:"photo", url}); render(); }
      catch(err){ toast(t("networkError"), true); }
    });

    // camera video — read as-is (compressing video in-browser isn't practical here)
    $("#in-video").addEventListener("change", async e=>{
      const file = e.target.files[0]; if(!file) return;
      try{ const url = await readFileAsDataUrl(file); state.draft.media.push({kind:"video", url}); render(); }
      catch(err){ toast(t("networkError"), true); }
    });

    // choose from device — could be either an existing photo or video from the gallery
    $("#in-file-picker").addEventListener("change", async e=>{
      const file = e.target.files[0]; if(!file) return;
      try{
        if(file.type.startsWith("video/")){
          const url = await readFileAsDataUrl(file); state.draft.media.push({kind:"video", url});
        } else {
          const url = await compressImageFile(file); state.draft.media.push({kind:"photo", url});
        }
        render();
      }catch(err){ toast(t("networkError"), true); }
    });

    $$("[data-rm-media]").forEach(b=>b.addEventListener("click", ()=>{ state.draft.media.splice(Number(b.dataset.rmMedia),1); render(); }));

    $("#btn-submit-issue").addEventListener("click", ()=>{
      if(state.patrol.paused) return; // guarded by the disabled attribute too, but belt-and-braces
      const cat = CATEGORIES.find(c=>c.id===state.activeCategory);
      if(!state.draft.text.trim() && state.draft.media.length===0){ alert(t("missingFields")); return; }
      state.reports.push({
        id:"r"+Date.now()+Math.random().toString(16).slice(2),
        towerId: state.tower.id, towerObj: state.tower, level: state.level,
        locationId: state.location.id, locationObj: state.location,
        category: cat.id, assets:[...state.selectedAssets],
        text: state.draft.text.trim(), media:[...state.draft.media],
        risk: state.tower.riskScale ? (state.draft.risk || DEFAULT_RISK) : null,
      });
      toast(t("issueLogged"));
      state.draft = {text:"", media:[], risk:DEFAULT_RISK}; state.selectedAssets = [];
      go("category");
    });
  }
  if(state.screen==="summary"){
    $$("[data-remove]").forEach(b=>b.addEventListener("click", ()=>{ state.reports = state.reports.filter(r=>r.id!==b.dataset.remove); render(); }));
    const finalBtn = $("#btn-final-submit");
    if(finalBtn) finalBtn.addEventListener("click", async ()=>{
      if(!confirm(t("finalConfirm", state.reports.length))) return;
      const entries = state.reports.map(r=>({ tower:r.towerObj.en, level:r.level, location:r.locationId, category:r.category, assets:r.assets, text:r.text, photos:r.media.map(m=>m.url), ...(r.risk ? { risk:r.risk } : {}) }));

      if(!navigator.onLine){
        queueOffline(state.officer, entries);
        state.lastSaved = entries.length; state.lastSkipped = 0;
        state.reports = []; state.offlineSuccess = true; go("success");
        return;
      }

      state.sending = true; render();
      const { ok, data } = await callScript("submit-patrol", { officer: state.officer, entries });
      state.sending = false;
      if(ok){
        state.lastSkipped = (data.skipped||[]).length;
        state.lastSaved = (typeof data.saved === "number") ? data.saved : entries.length;
        state.reports = []; state.offlineSuccess = false; go("success");
      } else if(!navigator.onLine){
        // connection dropped mid-request — don't lose the work, queue it instead
        queueOffline(state.officer, entries);
        state.lastSaved = entries.length; state.lastSkipped = 0;
        state.reports = []; state.offlineSuccess = true; go("success");
      } else {
        toast((data && data.error) || t("networkError"), true); render();
      }
    });
  }
  if(state.screen==="success"){
    $("#btn-new-patrol").addEventListener("click", ()=>{
      state.tower=null; state.level=null; state.location=null; state.activeCategory=null;
      state.selectedAssets=[]; state.reportedTags=[]; state.draft={text:"",media:[],risk:DEFAULT_RISK}; state.reports=[]; state.lastSkipped=0; state.lastSaved=0;
      state.patrol={sessionId:null,startedAt:null,paused:false,lastPauseAt:null,pausedMs:0};
      state.pendingIssues=[]; state.pendingLoading=false;
      go("tower");
    });
  }
}

flushOfflineQueue(); // in case there's already a queued patrol from a previous offline session

/* ============================================================
   PHONE / BROWSER BACK BUTTON — on its own, a back gesture just closes
   the page instantly with no warning, since this is a single-page app
   with no real browser history. This traps it instead: while an officer
   is signed in, pressing back asks the same yes/no logout question as
   the in-app logout button, and only actually signs out if they confirm.
   Cancelling keeps them exactly where they were, mid-patrol data intact.
   ============================================================ */
history.pushState({fls:true}, "", "");
window.addEventListener("popstate", ()=>{
  if(state.officer){
    // Re-claim a history entry immediately so the page itself doesn't
    // navigate away while the officer is deciding.
    history.pushState({fls:true}, "", "");
    confirmAndLogout();
  }
  // Not signed in (still on the login screen) — nothing to protect,
  // let the back gesture behave normally.
});
</script>
